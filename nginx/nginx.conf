# Tácticas de disponibilidad (categoría: recuperarse de fallas).
# Viven en el proxy inverso y no en la aplicación: es el elemento que DETECTA la falla,
# no el que la sufre. Los escáneres quedan agnósticos a la topología (ADR-001).

upstream ruteo_equipaje {
    server app1:3000 max_fails=2 fail_timeout=10s;
    # max_fails=0: el repuesto nunca se marca caído. Sin esto hereda max_fails=1 y un
    # solo 503 suyo deja a las dos instancias fuera de rotación durante fail_timeout.
    server app2:3000 backup max_fails=0;  # táctica: repuesto redundante (warm, ADR-003)
}

server {
    listen 80;

    location / {
        proxy_pass http://ruteo_equipaje;

        # táctica: reintentos
        # http_503 es lo que hace que la saturación del bulkhead cuente como falla:
        # sin él no hay reintento ni conmutación al repuesto.
        proxy_next_upstream       error timeout http_503;
        proxy_next_upstream_tries 3;
        proxy_connect_timeout     1s;

        # Evidencia observable: en una sola respuesta se ve el reintento, el failover
        # y el tiempo que tardó la conmutación. Es el artefacto central de la demo.
        #
        # $upstream_header_time y NO $upstream_response_time: add_header se evalúa cuando
        # Nginx manda los headers al cliente, momento en que la respuesta del upstream
        # todavía no terminó. $upstream_response_time sale "-" ahí. Verificado en banco.
        add_header X-Instancias-Probadas $upstream_addr          always;
        add_header X-Estados             $upstream_status        always;
        add_header X-Tiempo-Total        $upstream_header_time   always;
    }
}
